name: blinkr
description: Real-time staring contest mobile game

publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.3.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  dio: ^5.4.0
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  lottie: ^3.1.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.0

# app_links is pulled in transitively by supabase_flutter (OAuth deep-link
# callbacks). Version 6.4.1 "Updated Gradle settings" to read
# flutter.compileSdkVersion, which the Flutter 3.24 build does not expose to
# plugin subprojects, breaking the Android build. 6.4.0 uses the older Gradle
# convention and is API-compatible. Pinned here so the CI's fresh resolution
# (pubspec.lock is removed) cannot float back up to 6.4.1.
dependency_overrides:
  app_links: 6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
