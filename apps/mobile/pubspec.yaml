name: blinkr
description: Real-time staring contest mobile game

publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.3.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  dio: ^5.4.0
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  google_fonts: ^6.2.1         # Ink-Punk type lanes: Bebas Neue, Barlow
                               # Condensed, Share Tech Mono, Inter
  lottie: ^3.1.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.0
  audioplayers: ^6.1.0
  livekit_client: ^2.3.0       # Live video/audio between matched players
  flutter_webrtc: any          # Version governed by livekit_client; declared
                               # for direct MediaStreamTrack.captureFrame() use
  google_mlkit_face_detection: ^0.13.0  # On-device blink detection — eye-open
                                        # probability (docs/FACE_TRACKING_SCOPE.md)
  shared_preferences: ^2.2.0
  image_picker: ^1.1.2
  # Matchmaking
  share_plus: ^10.1.0          # Feature 1 — native share sheet for invite links
  qr_flutter: ^4.1.0           # Feature 4 — QR display
  mobile_scanner: ^7.2.0       # Feature 4 — QR scanning (v7 drops GoogleMLKit on iOS, fixing MLKitVision conflict with face_detection)
  flutter_contacts: ^1.1.9+2   # Feature 2 — contact discovery (hashed)
  permission_handler: ^11.3.1  # Features 2/4 — rationale-first permission flows
  geolocator: ^13.0.2          # Feature 5 — GPS radius matching
  flutter_map: ^7.0.2          # Feature 5 — interactive nearby-players map
  latlong2: ^0.9.1             # Feature 5 — LatLng + bearing math for map markers

# app_links is pulled in transitively by supabase_flutter (OAuth deep-link
# callbacks). Version 6.4.1 "Updated Gradle settings" to read
# flutter.compileSdkVersion, which the Flutter 3.24 build does not expose to
# plugin subprojects, breaking the Android build. 6.4.0 uses the older Gradle
# convention and is API-compatible. Pinned here so the CI's fresh resolution
# (pubspec.lock is removed) cannot float back up to 6.4.1.
dependency_overrides:
  app_links: 6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/background_music.mp3
