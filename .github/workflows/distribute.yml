name: Build & Distribute

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'New build from main branch'

jobs:
  android:
    name: Android — Firebase App Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold missing Android platform files
        run: |
          cd apps/mobile
          cp pubspec.yaml /tmp/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/blinkr/app/MainActivity.kt /tmp/MainActivity.kt
          cp android/app/src/main/res/xml/network_security_config.xml /tmp/network_security_config.xml
          cp android/app/proguard-rules.pro /tmp/proguard-rules.pro
          flutter create --platforms android . --org com.blinkr
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -f pubspec.lock
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/MainActivity.kt android/app/src/main/kotlin/com/blinkr/app/MainActivity.kt
          cp /tmp/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml
          cp /tmp/proguard-rules.pro android/app/proguard-rules.pro
          # Flutter 3.44+ generates build.gradle.kts (Kotlin DSL); older versions use .gradle
          GRADLE_FILE=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          if [ -n "$GRADLE_FILE" ]; then
            sed -i "s/com\.blinkr\.mobile/com.blinkr.app/g;s/com\.blinkr\.blinkr/com.blinkr.app/g" "$GRADLE_FILE"
          fi
          rm -rf android/app/src/main/kotlin/com/blinkr/mobile android/app/src/main/kotlin/com/blinkr/blinkr
          echo "android.enableR8.fullMode=false" >> android/gradle.properties

      - name: Flutter pub get
        run: cd apps/mobile && flutter pub get

      - name: Generate Dart code (freezed, json_serializable)
        run: cd apps/mobile && flutter pub run build_runner build --delete-conflicting-outputs

      - name: Write dart-define file
        run: |
          cat > apps/mobile/.env.dart-define <<EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "API_BASE_URL": "${{ secrets.API_BASE_URL }}",
            "GOOGLE_IOS_CLIENT_ID": "${{ secrets.GOOGLE_IOS_CLIENT_ID }}",
            "GOOGLE_WEB_CLIENT_ID": "${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
          }
          EOF

      - name: Set up Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
              > apps/mobile/android/app/blinkr-release.keystore
            cat > apps/mobile/android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=app/blinkr-release.keystore
          EOF
            echo "Release keystore configured"
          else
            echo "No keystore secret — using debug signing"
          fi

      - name: Place google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/mobile/android/app/google-services.json

      - name: Build APK (release)
        run: |
          cd apps/mobile
          flutter build apk --release \
            --dart-define-from-file=.env.dart-define

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blinkr-android-release
          path: apps/mobile/build/app/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          file: apps/mobile/build/app/outputs/apk/release/app-release.apk
          releaseNotes: ${{ inputs.release_notes }}
          testers: tonyasnow120@gmail.com

  ios:
    name: iOS — TestFlight
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold missing iOS platform files
        run: |
          cd apps/mobile
          cp pubspec.yaml /tmp/pubspec.yaml
          cp ios/Runner/Info.plist /tmp/Info.plist
          cp ios/Runner/Runner.entitlements /tmp/Runner.entitlements
          cp ios/Runner/PrivacyInfo.xcprivacy /tmp/PrivacyInfo.xcprivacy
          flutter create --platforms ios . --org com.blinkr
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -f pubspec.lock
          cp /tmp/Info.plist ios/Runner/Info.plist
          cp /tmp/Runner.entitlements ios/Runner/Runner.entitlements
          cp /tmp/PrivacyInfo.xcprivacy ios/Runner/PrivacyInfo.xcprivacy
          # Fix bundle ID — flutter create uses directory name ('mobile') or pubspec
          # name ('blinkr'), neither of which is our registered bundle ID.
          sed -i '' \
            's/com\.blinkr\.mobile/com.blinkr.app/g;s/com\.blinkr\.blinkr/com.blinkr.app/g' \
            ios/Runner.xcodeproj/project.pbxproj

      - name: Patch Podfile — disable code signing for CocoaPod targets
        run: |
          python3 - <<'PYEOF'
          podfile_path = 'apps/mobile/ios/Podfile'
          with open(podfile_path, 'r') as f:
              content = f.read()
          marker = 'flutter_additional_ios_build_settings(target)'
          patch = (
              '\n      target.build_configurations.each do |config|\n'
              "        config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'\n"
              '      end'
          )
          if marker in content:
              content = content.replace(marker, marker + patch, 1)
              with open(podfile_path, 'w') as f:
                  f.write(content)
              print('Podfile patched — CODE_SIGNING_ALLOWED=NO for pod targets')
          else:
              print('WARNING: Podfile marker not found, skipping')
          PYEOF

      - name: Flutter pub get
        run: cd apps/mobile && flutter pub get

      - name: Generate Dart code (freezed, json_serializable)
        run: cd apps/mobile && flutter pub run build_runner build --delete-conflicting-outputs

      - name: Write dart-define file
        run: |
          cat > apps/mobile/.env.dart-define <<EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "API_BASE_URL": "${{ secrets.API_BASE_URL }}",
            "GOOGLE_IOS_CLIENT_ID": "${{ secrets.GOOGLE_IOS_CLIENT_ID }}",
            "GOOGLE_WEB_CLIENT_ID": "${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
          }
          EOF

      - name: Place GoogleService-Info.plist
        run: echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' > apps/mobile/ios/Runner/GoogleService-Info.plist

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ] || [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "Signing secrets not configured — will do unsigned verification build"
            echo "SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | xargs)
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode \
            -o ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          echo "=== Installed certificate ==="
          security find-identity -v -p codesigning

      - name: Write ExportOptions.plist and extract signing metadata
        if: env.SIGNING_AVAILABLE == 'true'
        run: |
          cd apps/mobile
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          security cms -D -i "$PROFILE_PATH" > /tmp/profile.plist
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" /tmp/profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /tmp/profile.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /tmp/profile.plist)
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" /tmp/profile.plist)
          PLATFORMS=$(/usr/libexec/PlistBuddy -c "Print Platform" /tmp/profile.plist 2>/dev/null || echo "n/a")
          PREFIX=$(/usr/libexec/PlistBuddy -c "Print ApplicationIdentifierPrefix:0" /tmp/profile.plist 2>/dev/null || echo "n/a")
          echo "Team: $TEAM_ID  Profile: $PROFILE_NAME  UUID: $PROFILE_UUID"
          echo "AppID (entitlements): $APP_ID"
          echo "ApplicationIdentifierPrefix: $PREFIX"
          echo "Platform: $PLATFORMS"
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.blinkr.app</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          PLIST
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "EXPORT_OPTIONS_PATH=$(pwd)/ExportOptions.plist" >> "$GITHUB_ENV"

      - name: Patch project.pbxproj — manual signing for Runner only
        if: env.SIGNING_AVAILABLE == 'true'
        run: |
          python3 - <<'PYEOF'
          import os, re

          project_path = 'apps/mobile/ios/Runner.xcodeproj/project.pbxproj'
          team_id = os.environ.get('TEAM_ID', '')
          profile_name = os.environ.get('PROFILE_NAME', '')

          print(f'TEAM_ID={team_id!r}  PROFILE_NAME={profile_name!r}')

          with open(project_path, 'r') as f:
              content = f.read()

          # Use PROVISIONING_PROFILE_SPECIFIER (display name) — confirmed working
          # in the "conflicting signing" error output which showed Xcode found the
          # profile by name. UUID-based PROVISIONING_PROFILE is deprecated in Xcode 14+
          # and silently ignored in Xcode 26, causing "no profiles found".
          signing_block = '\n'.join([
              'CODE_SIGN_IDENTITY = "Apple Distribution";',
              '\t\t\tCODE_SIGN_STYLE = Manual;',
              f'\t\t\tDEVELOPMENT_TEAM = {team_id};',
              f'\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile_name}";',
          ])

          patched = False

          # Approach 1: replace existing CODE_SIGN_STYLE = Automatic
          old = 'CODE_SIGN_STYLE = Automatic;'
          count = content.count(old)
          print(f'Approach 1 ({old!r}): {count} hit(s)')
          if count > 0:
              content = content.replace(old, signing_block)
              patched = True
              print(f'  -> replaced {count} occurrence(s)')

          # Approach 2: inject after INFOPLIST_FILE — regex handles quoted and
          # unquoted path values ("Runner/Info.plist" and Runner/Info.plist)
          if not patched:
              pat = re.compile(r'(INFOPLIST_FILE\s*=\s*[^;]+;)')
              hits = pat.findall(content)
              print(f'Approach 2 (INFOPLIST_FILE regex): {len(hits)} hit(s)')
              if hits:
                  content = pat.sub(
                      lambda m: m.group(1) + '\n\t\t\t' + signing_block, content
                  )
                  patched = True
                  print(f'  -> injected after {len(hits)} occurrence(s)')

          # Approach 3: anchor on PRODUCT_BUNDLE_IDENTIFIER = com.blinkr.app
          # Guaranteed present after the sed patch in the scaffold step.
          if not patched:
              anchor = 'PRODUCT_BUNDLE_IDENTIFIER = com.blinkr.app;'
              count3 = content.count(anchor)
              print(f'Approach 3 ({anchor!r}): {count3} hit(s)')
              if count3 > 0:
                  content = content.replace(
                      anchor, anchor + '\n\t\t\t' + signing_block
                  )
                  patched = True
                  print(f'  -> injected after {count3} occurrence(s)')

          if not patched:
              print('ERROR: all three approaches failed — project.pbxproj NOT patched')

          content = content.replace('DEVELOPMENT_TEAM = "";', f'DEVELOPMENT_TEAM = {team_id};')

          # The PBXProject section also records signing style per-target via
          # TargetAttributes -> <TARGET_ID> -> ProvisioningStyle = Automatic.
          # Xcode's signing resolution honors THIS key independently of the
          # per-configuration CODE_SIGN_STYLE patched above — leaving it as
          # Automatic causes Xcode to ignore our manual signing settings and
          # search for "iOS App Development" profiles ("No profiles for
          # 'com.blinkr.app' were found... Automatic signing is disabled and
          # unable to generate a profile"), even though CODE_SIGN_STYLE=Manual
          # is set elsewhere.
          attr_old = 'ProvisioningStyle = Automatic;'
          attr_count = content.count(attr_old)
          print(f'TargetAttributes ({attr_old!r}): {attr_count} hit(s)')
          if attr_count > 0:
              content = content.replace(attr_old, 'ProvisioningStyle = Manual;')
              print(f'  -> replaced {attr_count} occurrence(s)')

          with open(project_path, 'w') as f:
              f.write(content)

          print(f'project.pbxproj patched={patched}')
          PYEOF

      - name: Dump signing-related pbxproj lines (diagnostic)
        if: env.SIGNING_AVAILABLE == 'true'
        run: |
          cd apps/mobile
          grep -n -E "CODE_SIGN|PROVISIONING_PROFILE|DEVELOPMENT_TEAM|ProvisioningStyle|PRODUCT_BUNDLE_IDENTIFIER|/\* (Debug|Release|Profile) \*/ = \{|isa = (PBXNativeTarget|XCBuildConfiguration|PBXProject)|name = (Runner|RunnerTests)" \
            ios/Runner.xcodeproj/project.pbxproj || true

      - name: Build IPA (signed — TestFlight)
        if: env.SIGNING_AVAILABLE == 'true'
        run: |
          cd apps/mobile
          # Compile Dart; signing is deferred to the xcodebuild archive step.
          flutter build ios --release --no-codesign \
            --dart-define-from-file=.env.dart-define

          # Archive using project.pbxproj signing (patched above for Runner only).
          # CODE_SIGN_STYLE=Manual + PROVISIONING_PROFILE_SPECIFIER are set in
          # project.pbxproj for Runner's build configs. Only DEVELOPMENT_TEAM is
          # passed on the CLI — safe with both Automatic and Manual signing modes,
          # and does not propagate provisioning-profile requirements to SPM targets.
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            archive \
            -archivePath /tmp/blinkr.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID"

          xcodebuild \
            -exportArchive \
            -archivePath /tmp/blinkr.xcarchive \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -exportPath build/ios/ipa

      - name: Build IPA (unsigned — compilation verification only)
        if: env.SIGNING_AVAILABLE != 'true'
        run: |
          cd apps/mobile
          flutter build ipa --release --no-codesign \
            --dart-define-from-file=.env.dart-define

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blinkr-ios-build
          path: apps/mobile/build/ios/ipa/*.ipa
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload to TestFlight
        if: env.SIGNING_AVAILABLE == 'true'
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: apps/mobile/build/ios/ipa/blinkr.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
