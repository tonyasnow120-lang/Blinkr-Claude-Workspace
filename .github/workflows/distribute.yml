name: Build & Distribute

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'New build from main branch'

jobs:
  android:
    name: Android — Firebase App Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.x (Flutter 3.24 template) requires JDK 17. Pin it so the runner's
      # default Java version cannot break the Gradle build.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Flutter 3.24 ships an Android template using Kotlin 1.8.22 + AGP 8.x,
      # which matches the modern AndroidX dependencies. Flutter 3.22 used Kotlin
      # 1.6 and produced a broken embedding (black screen on launch).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Scaffold missing Android platform files
        run: |
          cd apps/mobile
          # Save custom files that flutter create would overwrite
          cp pubspec.yaml /tmp/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/blinkr/app/MainActivity.kt /tmp/MainActivity.kt
          cp android/app/src/main/res/xml/network_security_config.xml /tmp/network_security_config.xml
          cp android/app/proguard-rules.pro /tmp/proguard-rules.pro
          # Generate all missing Gradle files, wrapper, icons, etc.
          flutter create --platforms android . --org com.blinkr
          # Restore our custom files on top (flutter create overwrites these)
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -f pubspec.lock  # Force fresh resolution so dependency_overrides take effect
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/MainActivity.kt android/app/src/main/kotlin/com/blinkr/app/MainActivity.kt
          cp /tmp/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml
          cp /tmp/proguard-rules.pro android/app/proguard-rules.pro
          # flutter create names the app after the directory ('mobile') → fix applicationId/namespace
          sed -i 's/com\.blinkr\.mobile/com.blinkr.app/g' android/app/build.gradle
          # Delete the stale MainActivity flutter create generated at the 'mobile'
          # package path; ours lives at com/blinkr/app. Leaving both is a defect.
          rm -rf android/app/src/main/kotlin/com/blinkr/mobile
          # R8 full mode treats missing optional classes (e.g. the Play Core
          # deferred-component references in the Flutter embedding, which we do
          # not use) as fatal. Relax to compat mode so they are warnings, not
          # build failures. The proguard-rules.pro -dontwarn handles them too.
          echo "android.enableR8.fullMode=false" >> android/gradle.properties

      - name: Flutter pub get
        run: cd apps/mobile && flutter pub get

      - name: Generate Dart code (freezed, json_serializable)
        run: cd apps/mobile && flutter pub run build_runner build --delete-conflicting-outputs

      - name: Write dart-define file
        run: |
          cat > apps/mobile/.env.dart-define <<EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "API_BASE_URL": "${{ secrets.API_BASE_URL }}",
            "GOOGLE_IOS_CLIENT_ID": "${{ secrets.GOOGLE_IOS_CLIENT_ID }}",
            "GOOGLE_WEB_CLIENT_ID": "${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
          }
          EOF

      - name: Set up Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
              > apps/mobile/android/app/blinkr-release.keystore
            cat > apps/mobile/android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=app/blinkr-release.keystore
          EOF
            echo "Release keystore configured"
          else
            echo "No keystore secret — using debug signing"
          fi

      - name: Place google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/mobile/android/app/google-services.json

      - name: Build APK (release)
        run: |
          cd apps/mobile
          flutter build apk --release \
            --dart-define-from-file=.env.dart-define

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blinkr-android-release
          path: apps/mobile/build/app/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          file: apps/mobile/build/app/outputs/apk/release/app-release.apk
          releaseNotes: ${{ inputs.release_notes }}
          testers: tonyasnow120@gmail.com

  ios:
    name: iOS — TestFlight
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Scaffold missing iOS platform files
        run: |
          cd apps/mobile
          # Save custom files that flutter create would overwrite
          cp pubspec.yaml /tmp/pubspec.yaml
          cp ios/Runner/Info.plist /tmp/Info.plist
          cp ios/Runner/Runner.entitlements /tmp/Runner.entitlements
          cp ios/Runner/PrivacyInfo.xcprivacy /tmp/PrivacyInfo.xcprivacy
          # Generate all missing iOS platform files (Podfile, xcodeproj, storyboards, etc.)
          flutter create --platforms ios . --org com.blinkr
          # Restore our custom files on top (flutter create overwrites these)
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -f pubspec.lock
          cp /tmp/Info.plist ios/Runner/Info.plist
          cp /tmp/Runner.entitlements ios/Runner/Runner.entitlements
          cp /tmp/PrivacyInfo.xcprivacy ios/Runner/PrivacyInfo.xcprivacy
          # flutter create names the app after the directory ('mobile') → fix bundle ID
          sed -i '' 's/com\.blinkr\.mobile/com.blinkr.app/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Flutter pub get
        run: cd apps/mobile && flutter pub get

      - name: Generate Dart code (freezed, json_serializable)
        run: cd apps/mobile && flutter pub run build_runner build --delete-conflicting-outputs

      - name: Write dart-define file
        run: |
          cat > apps/mobile/.env.dart-define <<EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "API_BASE_URL": "${{ secrets.API_BASE_URL }}",
            "GOOGLE_IOS_CLIENT_ID": "${{ secrets.GOOGLE_IOS_CLIENT_ID }}",
            "GOOGLE_WEB_CLIENT_ID": "${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
          }
          EOF

      - name: Place GoogleService-Info.plist
        run: echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' > apps/mobile/ios/Runner/GoogleService-Info.plist

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # If signing secrets are not set, skip — unsigned build follows
          if [ -z "$BUILD_CERTIFICATE_BASE64" ] || [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "Signing secrets not configured — will do unsigned verification build"
            echo "SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          # Create a temporary keychain so the agent certificate doesn't persist
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          # Add build keychain to the search list so Xcode can find the certificate
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | xargs)
          # Import distribution certificate
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode \
            -o ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Configure Xcode for manual signing
        if: env.SIGNING_AVAILABLE == 'true'
        run: |
          cd apps/mobile
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          # Decode CMS-signed profile to a plain plist so PlistBuddy can read it
          security cms -D -i "$PROFILE_PATH" > /tmp/profile.plist
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" /tmp/profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /tmp/profile.plist)
          echo "Team: $TEAM_ID  Profile: $PROFILE_NAME"
          # flutter create generates CODE_SIGN_STYLE = Automatic which requires an
          # Xcode login. Switch every configuration to manual so CI can use the
          # certificate we imported into the build keychain.
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' \
            ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/DEVELOPMENT_TEAM = \"\"/DEVELOPMENT_TEAM = \"$TEAM_ID\"/g" \
            ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' \
            ios/Runner.xcodeproj/project.pbxproj
          # Write ExportOptions.plist referencing the installed profile by name
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.blinkr.app</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          PLIST
          echo "EXPORT_OPTIONS_PATH=$(pwd)/ExportOptions.plist" >> "$GITHUB_ENV"

      - name: Build IPA (signed — TestFlight)
        if: env.SIGNING_AVAILABLE == 'true'
        run: |
          cd apps/mobile
          flutter build ipa --release \
            --export-options-plist="$EXPORT_OPTIONS_PATH" \
            --dart-define-from-file=.env.dart-define

      - name: Build IPA (unsigned — compilation verification only)
        if: env.SIGNING_AVAILABLE != 'true'
        run: |
          cd apps/mobile
          flutter build ipa --release --no-codesign \
            --dart-define-from-file=.env.dart-define

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blinkr-ios-build
          path: apps/mobile/build/ios/ipa/*.ipa
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload to TestFlight
        if: env.SIGNING_AVAILABLE == 'true'
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: apps/mobile/build/ios/ipa/blinkr.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
